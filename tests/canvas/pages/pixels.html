<!DOCTYPE html>
<html>
<head>
<title>Canvas: ImageData, getImageData, putImageData</title>
<script src="../../js/harness.js"></script>
<script src="util.js"></script>
</head>
<body>
<script>
test('the ImageData constructor', () => {
    const a = new ImageData(3, 2);
    assert.equal(a.width, 3);
    assert.equal(a.height, 2);
    assert.ok(a.data instanceof Uint8ClampedArray);
    assert.equal(a.data.length, 24);
    assert.equal(a.colorSpace, 'srgb');
    assert.ok(a.data.every((v) => v === 0), 'transparent black');
    assert.equal(String(a), '[object ImageData]');
    const bytes = new Uint8ClampedArray(16);
    const b = new ImageData(bytes, 2);
    assert.equal(b.height, 2);
    assert.equal(b.data, bytes, 'the array is used, not copied');
    assert.equal(new ImageData(bytes, 4, 1).height, 1);
    assert.throws(() => new ImageData(0, 5), 'IndexSizeError');
    assert.throws(() => new ImageData(5, 0), 'IndexSizeError');
    assert.throws(() => new ImageData(bytes, 3), 'IndexSizeError');
    assert.throws(() => new ImageData(bytes, 2, 3), 'IndexSizeError');
    assert.throws(() => new ImageData(new Uint8ClampedArray(7), 1), 'InvalidStateError');
    assert.throws(() => new ImageData(new Uint8ClampedArray(0), 1), 'InvalidStateError');
    assert.throws(() => new ImageData(5), TypeError);
    assert.throws(() => new ImageData(100000, 100000), RangeError);
    a.width = 9; /* read-only */
    assert.equal(a.width, 3);
});
test('createImageData', () => {
    const c = mk(10, 10);
    const a = c.createImageData(4, 3);
    assert.equal(a.width, 4);
    assert.equal(a.height, 3);
    const n = c.createImageData(-4, -3);
    assert.equal(n.width, 4, 'the size is the absolute value');
    const copy = c.createImageData(a);
    assert.equal(copy.width, 4);
    assert.notEqual(copy.data, a.data);
    assert.throws(() => c.createImageData(0, 1), 'IndexSizeError');
    assert.throws(() => c.createImageData(1), TypeError);
    assert.throws(() => c.createImageData(Infinity, 1), TypeError);
});
test('getImageData: RGBA bytes, not premultiplied', () => {
    const c = mk(10, 10);
    c.fillStyle = 'rgb(10, 20, 30)';
    c.fillRect(0, 0, 5, 5);
    c.fillStyle = 'rgba(200, 100, 50, 0.5)';
    c.fillRect(5, 0, 5, 5);
    const d = c.getImageData(0, 0, 10, 10);
    assert.equal(d.width, 10);
    assert.equal(d.data.length, 400);
    assert.deepEqual(Array.from(d.data.slice(0, 4)), [10, 20, 30, 255], 'R, G, B, A in order');
    near(d.data.slice(5 * 4, 5 * 4 + 4), [200, 100, 50, 128], 2, 'half alpha, colour not premultiplied');
    assert.deepEqual(Array.from(d.data.slice(9 * 10 * 4, 9 * 10 * 4 + 4)), CLEAR, 'untouched');
    /* a rectangle partly or wholly outside the canvas */
    const e = c.getImageData(-2, -2, 4, 4);
    assert.deepEqual(Array.from(e.data.slice(0, 4)), CLEAR);
    assert.deepEqual(Array.from(e.data.slice((2 * 4 + 2) * 4, (2 * 4 + 2) * 4 + 4)), [10, 20, 30, 255]);
    assert.ok(c.getImageData(100, 100, 3, 3).data.every((v) => v === 0));
    assert.ok(c.getImageData(-1e9, 2e9, 2, 2).data.every((v) => v === 0));
    /* a negative size is the same rectangle */
    const f = c.getImageData(5, 5, -5, -5);
    assert.equal(f.width, 5);
    assert.deepEqual(Array.from(f.data.slice(0, 4)), [10, 20, 30, 255]);
    assert.throws(() => c.getImageData(0, 0, 0, 1), 'IndexSizeError');
    assert.throws(() => c.getImageData(0, 0, 1), TypeError);
    assert.throws(() => c.getImageData(0, 0, NaN, 1), TypeError);
    assert.throws(() => c.getImageData(0, 0, 100000, 100000), RangeError);
    /* the transform and clip do not apply */
    c.translate(5, 5);
    c.beginPath();
    c.rect(0, 0, 1, 1);
    c.clip();
    assert.deepEqual(px(c, 0, 0), [10, 20, 30, 255]);
});
test('putImageData replaces pixels', () => {
    const c = mk(10, 10);
    c.fillStyle = 'red';
    c.fillRect(0, 0, 10, 10);
    const d = new ImageData(2, 2);
    d.data.set([0, 0, 255, 255, 0, 255, 0, 128, 1, 2, 3, 0, 255, 255, 255, 255]);
    c.globalAlpha = 0.1;
    c.globalCompositeOperation = 'xor';
    c.shadowColor = 'black';
    c.shadowOffsetX = 3;
    c.translate(5, 5);
    c.putImageData(d, 4, 4);
    isPx(c, 4, 4, BLUE, 0, 'no transform, alpha, operator or shadow');
    near(px(c, 5, 4), [0, 255, 0, 128], 2, 'a half-transparent pixel replaces, not blends');
    assert.deepEqual(px(c, 4, 5), CLEAR, 'alpha 0 clears the pixel');
    isPx(c, 5, 5, WHITE);
    isPx(c, 6, 6, RED, 0, 'beyond the data: untouched');
    isPx(c, 7, 4, RED, 0, 'no shadow');
    /* off the canvas: the part that fits */
    c.putImageData(d, 9, 9);
    isPx(c, 9, 9, BLUE);
    c.putImageData(d, -1, -1);
    isPx(c, 0, 0, WHITE);
    c.putImageData(d, 500, 500);
    c.putImageData(d, -2147483648, 2147483647);
    assert.throws(() => c.putImageData({}, 0, 0), TypeError);
    assert.throws(() => c.putImageData(d, NaN, 0), TypeError);
    assert.throws(() => c.putImageData(d), TypeError);
});
test('putImageData with a dirty rectangle', () => {
    const c = mk(10, 10);
    const d = new ImageData(4, 4);
    for (let i = 0; i < 16; i++) d.data.set([i * 16, 0, 255 - i * 16, 255], i * 4);
    c.putImageData(d, 2, 2, 1, 1, 2, 2);
    assert.deepEqual(px(c, 2, 2), CLEAR, 'outside the dirty rectangle');
    isPx(c, 3, 3, [5 * 16, 0, 255 - 5 * 16, 255]);
    isPx(c, 4, 4, [10 * 16, 0, 255 - 10 * 16, 255]);
    assert.deepEqual(px(c, 5, 5), CLEAR);
    /* a negative size turns the rectangle round; parts off the data are cut */
    c.reset();
    c.putImageData(d, 0, 0, 3, 3, -2, -2);
    isPx(c, 1, 1, [5 * 16, 0, 255 - 5 * 16, 255]);
    isPx(c, 2, 2, [10 * 16, 0, 255 - 10 * 16, 255]);
    assert.deepEqual(px(c, 3, 3), CLEAR);
    assert.deepEqual(px(c, 0, 0), CLEAR);
    c.reset();
    c.putImageData(d, 0, 0, -10, -10, 100, 100);
    isPx(c, 3, 3, [15 * 16, 0, 15, 255], 0, 'the whole data');
    c.reset();
    c.putImageData(d, 0, 0, 2, 2, 0, 5);
    assert.ok(c.getImageData(0, 0, 10, 10).data.every((v) => v === 0), 'an empty dirty rectangle writes nothing');
    c.putImageData(d, 0, 0, 2147483647, 2147483647, 2147483647, 2147483647);
    c.putImageData(d, 0, 0, -2147483648, 0, -2147483648, 1);
});
test('round trips', () => {
    const c = mk(16, 16);
    /* opaque and transparent pixels come back exactly */
    const d = new ImageData(16, 16);
    for (let i = 0; i < 256; i++) d.data.set([i, 255 - i, (i * 7) & 255, i % 3 ? 255 : 0], i * 4);
    c.putImageData(d, 0, 0);
    const e = c.getImageData(0, 0, 16, 16);
    for (let i = 0; i < 256; i++) {
        const want = i % 3 ? [i, 255 - i, (i * 7) & 255, 255] : CLEAR;
        assert.deepEqual(Array.from(e.data.slice(i * 4, i * 4 + 4)), want, 'pixel ' + i);
    }
    /* partial alpha: the alpha is exact and the colour is as close as premultiplied 8-bit storage allows */
    for (const a of [1, 2, 17, 64, 128, 200, 254]) {
        const p = new ImageData(new Uint8ClampedArray([200, 100, 50, a]), 1, 1);
        c.putImageData(p, 0, 0);
        const q = px(c, 0, 0);
        assert.equal(q[3], a, 'alpha ' + a);
        const tol = Math.ceil(255 / a / 2) + 1;
        near(q, [200, 100, 50, a], tol, 'alpha ' + a);
    }
    /* a filter: read, change, write back */
    c.reset();
    c.fillStyle = 'rgb(100, 150, 200)';
    c.fillRect(0, 0, 16, 16);
    const img = c.getImageData(0, 0, 16, 16);
    for (let i = 0; i < img.data.length; i += 4) {
        img.data[i] = 255 - img.data[i];
        img.data[i + 1] = 255 - img.data[i + 1];
        img.data[i + 2] = 255 - img.data[i + 2];
    }
    c.putImageData(img, 0, 0);
    isPx(c, 8, 8, [155, 105, 55, 255]);
});
test('a subarray and a detached size', () => {
    const c = mk(4, 4);
    const big = new Uint8ClampedArray(64);
    big.fill(255, 16, 32);
    const part = new ImageData(big.subarray(16, 32), 2, 2); /* a view at an offset into its buffer */
    c.putImageData(part, 1, 1);
    isPx(c, 1, 1, WHITE);
    isPx(c, 2, 2, WHITE);
    assert.deepEqual(px(c, 0, 0), CLEAR);
});
</script>
</body>
</html>
