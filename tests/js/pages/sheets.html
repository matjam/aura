<!DOCTYPE html>
<html>
<head>
<title>Style sheets that script changes</title>
<script src="../harness.js"></script>
<style id="inline">#target { background-color: rgb(255, 0, 0); }</style>
<link id="link" rel="stylesheet" href="res/green.css">
</head>
<body>
<p id="target">x</p>
<script>
const target = document.getElementById('target');
const style = () => getComputedStyle(target);
const loaded = new Promise((resolve) => window.addEventListener('load', resolve));
/* Resolves once cond() holds (a sheet has loaded), or after 5 s. */
const until = (cond) => new Promise((resolve) => {
    const t0 = performance.now();
    const poll = () => (cond() || performance.now() - t0 > 5000 ? resolve() : setTimeout(poll, 10));
    poll();
});

promise_test('a <style> element\'s new text applies', async () => {
    await loaded;
    assert.equal(style().backgroundColor, 'rgb(255, 0, 0)');
    document.getElementById('inline').textContent = '#target { background-color: rgb(0, 0, 255); }';
    assert.equal(style().backgroundColor, 'rgb(0, 0, 255)');
    document.getElementById('inline').firstChild.data = '#target { background-color: rgb(1, 2, 3); }';
    assert.equal(style().backgroundColor, 'rgb(1, 2, 3)');
    document.getElementById('inline').media = 'print';
    assert.equal(style().backgroundColor, 'rgba(0, 0, 0, 0)');
});
promise_test('@container rules inserted and deleted by script apply', async () => {
    await loaded;
    const box = document.createElement('div');
    box.style.cssText = 'container-type: inline-size; width: 300px';
    const inner = document.createElement('p');
    box.appendChild(inner);
    document.body.appendChild(box);
    const s = document.createElement('style');
    s.textContent = 'p.x { color: rgb(1, 1, 1); }';
    document.head.appendChild(s);
    inner.className = 'x';
    assert.equal(getComputedStyle(inner).color, 'rgb(1, 1, 1)');
    s.sheet.insertRule('@container (min-width: 200px) { p.x { color: rgb(0, 128, 0); } }', 1);
    assert.equal(getComputedStyle(inner).color, 'rgb(0, 128, 0)');
    s.sheet.cssRules[1].insertRule('p.x { width: 50cqw; }', 1);
    assert.equal(getComputedStyle(inner).width, '150px');
    box.style.width = '100px';
    assert.equal(getComputedStyle(inner).color, 'rgb(1, 1, 1)', 'the container is narrower now');
    box.style.width = '300px';
    assert.equal(getComputedStyle(inner).color, 'rgb(0, 128, 0)');
    s.sheet.deleteRule(1);
    assert.equal(getComputedStyle(inner).color, 'rgb(1, 1, 1)');
    s.remove();
    box.remove();
});
promise_test('a <link>\'s disabled and href apply', async () => {
    await loaded;
    const link = document.getElementById('link');
    assert.equal(style().color, 'rgb(0, 128, 0)');
    link.setAttribute('disabled', '');
    assert.notEqual(style().color, 'rgb(0, 128, 0)');
    link.removeAttribute('disabled');
    await until(() => style().color === 'rgb(0, 128, 0)');
    assert.equal(style().color, 'rgb(0, 128, 0)');
    link.href = 'res/blue.css';
    await until(() => style().color === 'rgb(0, 0, 255)');
    assert.equal(style().color, 'rgb(0, 0, 255)');
});
</script>
</body>
</html>
