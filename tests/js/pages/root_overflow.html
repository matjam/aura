<!DOCTYPE html>
<html>
<head>
<title>The root's overflow goes to the viewport</title>
<script src="../harness.js"></script>
<style>
/* DuckDuckGo's HTML results page: the window must scroll */
html { height: 100%; overflow-x: hidden; overflow-y: auto; }
body { margin: 0; overflow-x: hidden; }
#tall { height: 3000px; }
#wide { width: 5000px; height: 10px; }
</style>
</head>
<body>
<div id="wide"></div>
<div id="tall"></div>
<script>
test('the document scrolls down past the root height', () => {
    /* it was the viewport's height while the root clipped */
    assert.ok(document.documentElement.scrollHeight >= 3000, 'scrollHeight ' + document.documentElement.scrollHeight);
});
test('the root is not a scroll container of its own', () => {
    assert.equal(document.documentElement.scrollTop, 0);
    assert.equal(document.documentElement.clientHeight, window.innerHeight);
});
test('overflow-x: hidden on the root leaves nothing to scroll to sideways', () => {
    assert.equal(document.documentElement.scrollWidth, window.innerWidth);
});
test('a body overflow on a visible root goes to the viewport too', () => {
    document.documentElement.style.overflow = 'visible';
    document.body.style.overflow = 'auto';
    document.body.style.height = '100px';
    assert.ok(document.documentElement.scrollHeight >= 3000, 'scrollHeight ' + document.documentElement.scrollHeight);
});
</script>
</body>
</html>
