<!DOCTYPE html>
<html>
<head>
<title>Image load and error events</title>
<script src="../harness.js"></script>
</head>
<body>
<script>
/* Listeners on the document in the capture phase see the parser's images,
 * the way lazy loaders and React's onLoad do (load does not reach window). */
window.imgEvents = [];
document.addEventListener('load', (e) => { if (e.target.tagName === 'IMG') imgEvents.push(e.target.id + ':load'); }, true);
document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') imgEvents.push(e.target.id + ':error'); }, true);
</script>
<img id="good" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==">
<img id="bad" src="res/missing.png" alt="missing">
<img id="attr" onload="window.attrLoaded = this.naturalWidth" src="data:image/gif;base64,R0lGODlhAgABAIAAAP///wAAACH5BAEAAAAALAAAAAACAAEAAAICRAEAOw==">
<script>
promise_test('images the parser made fire load or error once', async () => {
    while (imgEvents.length < 3) await delay(10);
    await delay(50);
    assert.deepEqual(imgEvents.slice().sort(), ['attr:load', 'bad:error', 'good:load']);
    assert.equal(window.attrLoaded, 2, 'the onload attribute runs, with the size known');
});

promise_test('setting the src attribute fires load again', async () => {
    const img = document.getElementById('good');
    const p = once(img, 'load');
    img.setAttribute('src', 'data:image/gif;base64,R0lGODlhAgABAIAAAP///wAAACH5BAEAAAAALAAAAAACAAEAAAICRAEAOw==');
    await p;
    assert.equal(img.naturalWidth, 2);
});

promise_test('an image with no box gives its natural size as width and height', async () => {
    const img = new Image();
    assert.equal(img.width, 0, 'nothing before it loads');
    const p = once(img, 'load');
    img.src = 'data:image/gif;base64,R0lGODlhAwABAIAAAP///wAAACH5BAEAAAAALAAAAAADAAEAAAICRAEAOw==';
    await p;
    assert.equal(img.width, 3);
    assert.equal(img.height, 1);
    img.setAttribute('width', '10');
    assert.equal(img.width, 10, 'the attribute first');
});

promise_test('decode() waits for the image and rejects a broken one', async () => {
    const img = document.createElement('img');
    img.setAttribute('src', 'data:image/gif;base64,R0lGODlhAwABAIAAAP///wAAACH5BAEAAAAALAAAAAADAAEAAAICRAEAOw==');
    document.body.appendChild(img);
    await img.decode();
    assert.equal(img.naturalWidth, 3, 'the size is known when decode resolves');
    const bad = document.createElement('img');
    bad.setAttribute('src', 'res/missing.png');
    document.body.appendChild(bad);
    let err = null;
    try { await bad.decode(); } catch (e) { err = e; }
    assert.equal(err && err.name, 'EncodingError');
    let none = null;
    try { await document.createElement('img').decode(); } catch (e) { none = e; }
    assert.equal(none && none.name, 'EncodingError', 'no source');
});

test('checkVisibility follows the box, visibility and opacity', () => {
    const d = document.createElement('div');
    d.textContent = 'x';
    document.body.appendChild(d);
    assert.equal(d.checkVisibility(), true);
    d.style.visibility = 'hidden';
    assert.equal(d.checkVisibility(), true, 'visibility counts only when asked');
    assert.equal(d.checkVisibility({ checkVisibilityCSS: true }), false);
    d.style.visibility = '';
    document.body.style.opacity = '0';
    assert.equal(d.checkVisibility({ checkOpacity: true }), false, 'an ancestor of opacity 0');
    document.body.style.opacity = '';
    d.style.display = 'none';
    assert.equal(d.checkVisibility(), false, 'no box');
    d.remove();
});

promise_test('an image inserted by script with src set fires load once', async () => {
    const img = document.createElement('img');
    let loads = 0;
    img.addEventListener('load', () => loads++);
    const p = once(img, 'load');
    img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==';
    document.body.appendChild(img);
    await p;
    await delay(50);
    assert.equal(loads, 1);
});
</script>
</body>
</html>
