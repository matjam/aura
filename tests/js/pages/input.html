<!DOCTYPE html>
<!-- page args: --click js --click cancel --click nav --click remove --click inner -->
<html>
<head>
<title>Clicks, inline handlers and javascript: links</title>
<script src="../harness.js"></script>
<style>
a { display: block; width: 200px; height: 30px; }
#box { width: 100px; height: 50px; }
.wide { width: 300px !important; }
</style>
</head>
<body onload="window.bodyOnload = (window.bodyOnload || 0) + 1">
<a id="js" href="javascript:window.jsUrlRan = (window.jsUrlRan || 0) + 1; void 0">javascript: link</a>
<a id="cancel" href="javascript:window.cancelledRan = 1" onclick="window.onclickRan = 1; return false">cancelled</a>
<a id="nav" href="next.html" onclick="window.navClicks = (window.navClicks || 0) + 1">plain link</a>
<a id="remove" href="gone.html" onclick="this.remove(); event.preventDefault()">removes itself</a>
<div id="target"><span id="inner">inner</span></div>
<div id="box">box</div>
<script>
const seen = [];
for (const t of ['mousedown', 'mouseup', 'click'])
    document.addEventListener(t, (e) => seen.push(t + ':' + e.target.id));
test('geometry reads force layout of script changes', () => {
    const box = document.getElementById('box');
    assert.equal(box.offsetWidth, 100);
    box.classList.add('wide');
    assert.equal(box.offsetWidth, 300);
    assert.equal(getComputedStyle(box).width, '300px');
    box.classList.remove('wide');
    box.style.height = '70px';
    assert.equal(box.getBoundingClientRect().height, 70);
});
test('the viewport and the document size', () => {
    /* innerWidth and scrollY need no layout; scrollHeight does, and sees
     * a change script just made */
    assert.ok(innerWidth > 0 && innerHeight > 0, innerWidth + 'x' + innerHeight);
    assert.equal(scrollY, 0);
    const tall = document.createElement('div');
    tall.style.height = (innerHeight * 3) + 'px';
    document.body.appendChild(tall);
    assert.ok(document.documentElement.scrollHeight >= innerHeight * 3, String(document.documentElement.scrollHeight));
    assert.ok(document.documentElement.scrollWidth >= 300, String(document.documentElement.scrollWidth));
    tall.remove();
    assert.ok(document.documentElement.scrollHeight < innerHeight * 3, String(document.documentElement.scrollHeight));
});
test('a style sheet added by script applies, and stops applying when removed', () => {
    const st = document.createElement('style');
    st.textContent = '#box { width: 123px }';
    document.head.appendChild(st);
    assert.equal(getComputedStyle(document.getElementById('box')).width, '123px');
    st.remove();
    assert.equal(getComputedStyle(document.getElementById('box')).width, '100px');
});
test('a range has rectangles', () => {
    const r = document.createRange();
    r.selectNodeContents(document.getElementById('target'));
    const b = r.getBoundingClientRect();
    assert.ok(b.width > 0 && b.height > 0, 'a rectangle with area: ' + b.width + 'x' + b.height);
    assert.ok(r.getClientRects().length >= 1);
    r.collapse(true);
    assert.equal(r.getBoundingClientRect().width, 0);
});
test('a range in text has the rectangles of its characters', () => {
    const span = document.getElementById('inner'), t = span.firstChild; /* "inner" */
    const whole = document.createRange();
    whole.selectNodeContents(t);
    const w = whole.getBoundingClientRect(), box = span.getBoundingClientRect();
    assert.ok(Math.abs(w.width - box.width) < 0.01 && Math.abs(w.left - box.left) < 0.01, 'the whole text: ' + w.left + '+' + w.width);
    const r = document.createRange();
    r.setStart(t, 1);
    r.setEnd(t, 3);
    const rs = r.getClientRects();
    assert.equal(rs.length, 1);
    assert.ok(rs[0].left > w.left && rs[0].right < w.right && rs[0].width > 0, 'inside the text: ' + rs[0].left + '+' + rs[0].width);
    assert.equal(rs[0].top, w.top);
    /* the parts add up */
    const a = document.createRange(), b = document.createRange();
    a.setStart(t, 0); a.setEnd(t, 1);
    b.setStart(t, 3); b.setEnd(t, 5);
    const sum = a.getBoundingClientRect().width + rs[0].width + b.getBoundingClientRect().width;
    assert.ok(Math.abs(sum - w.width) < 0.01, 'parts: ' + sum + ' of ' + w.width);
    /* a collapsed range in text: one rectangle of no width, at the character */
    r.collapse(true);
    const c = r.getClientRects();
    assert.equal(c.length, 1);
    assert.equal(c[0].width, 0);
    assert.equal(c[0].left, rs[0].left);
    assert.equal(r.getBoundingClientRect().left, rs[0].left);
    /* text that is not rendered has none */
    const hidden = document.createElement('span');
    hidden.style.display = 'none';
    hidden.textContent = 'hidden';
    document.body.appendChild(hidden);
    const h = document.createRange();
    h.selectNodeContents(hidden.firstChild);
    assert.equal(h.getClientRects().length, 0);
    hidden.remove();
});
test('inserted content has geometry', () => {
    const p = document.createElement('p');
    p.textContent = 'added';
    document.body.appendChild(p);
    assert.ok(p.offsetHeight > 0);
    p.remove();
    assert.equal(p.offsetHeight, 0);
});
addEventListener('unload', () => {
    const check = (name, ok, extra) => { if (!ok) console.log('FAIL ' + name + (extra ? ': ' + extra : '')); };
    check('body onload ran once', window.bodyOnload === 1, window.bodyOnload);
    check('javascript: link ran once on click', window.jsUrlRan === 1, window.jsUrlRan);
    check('onclick returning false cancels the link', window.onclickRan === 1 && !window.cancelledRan);
    check('a plain link click runs its handler', window.navClicks === 1, window.navClicks);
    check('a handler may remove its own link', !document.getElementById('remove'));
    check('mouse events reach listeners in order', seen.slice(0, 3).join() === 'mousedown:js,mouseup:js,click:js', seen.join());
    check('click on a descendant targets it', seen.includes('click:inner'), seen.join());
});
</script>
</body>
</html>
