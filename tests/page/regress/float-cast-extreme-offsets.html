<!DOCTYPE html>
<!-- Float to int conversions that a page reaches with huge or NaN
     coordinates (UBSan: "outside the range of representable values"):
     the canvas translation in raster() and the rectangle and shadow
     paths, glyph positions in au_draw_glyph_run, element rectangles in
     forms.c and frames.c, a list box's scroll offset, gradient stops,
     SVG sizes and opacity. -->
<style>
.t { transform: translate(3e38px, 3e38px); }
.u { transform: translate(-3e38px, 1e38px) scale(1e30); }
.n { transform: translate(calc(1px * (1e38 * 1e38 - 1e38 * 1e38)), 0); }
.r { border-radius: 9px; border: 3px dotted red; box-shadow: 0 0 9px 3px blue; background: linear-gradient(red, blue); }
.p { position: relative; left: 3e38px; top: -3e38px; }
.q { position: absolute; left: 1e38px; top: 1e38px; margin-left: 3e38px; }
.g { background: repeating-linear-gradient(90deg, red calc(1px * (1e38 * 1e38)), blue calc(1px * (1e38 * 1e38 - 1e38 * 1e38))); height: 20px; }
.g2 { background: repeating-radial-gradient(red 1e38px, blue 3e38px); height: 20px; }
.w { font-weight: calc(0 / 0); font-size: 1e38px; }
.d { border: 0px dashed; width: 50px; border-top-width: calc(0px * 1); }
</style>
<div class="t r">text at a huge offset <b>bold</b></div>
<div class="u r">text 2</div>
<div class="n r">text 3</div>
<div class="p r">relative <input value="field"> <input type=checkbox> <button>b</button></div>
<div class="q r">absolute <select size=3><option>a<option>b</select> <textarea>t</textarea></div>
<div class="g"></div><div class="g2"></div>
<p class="w">w</p>
<div class="d r">d</div>
<iframe class="q" srcdoc="<p>frame"></iframe>
<iframe class="t" style="width:1e38px;height:1e38px" srcdoc="<p>frame"></iframe>
<svg width="1e38" height="1e38" class="t"><rect width="5" height="5" opacity="NaN" fill-opacity="1e39"/>
<image href="x.png" width="1e38" height="1e38"/><text x="1e38" y="1e38">svg</text></svg>
<canvas class="p" width="20" height="20"></canvas>
<ul class="t" style="list-style: inside disc"><li>item</li></ul>
<span class="t" style="display:inline-block;text-shadow: 1e38px 1e38px 3px red">shadow</span>
