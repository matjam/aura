<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Typeahead</title>
<style>
body { font: 14px/1.5 sans-serif; margin: 0 }
header { position: sticky; top: 0; background: #eee; padding: 8px }
.search { position: relative; width: 320px }
.search input { width: 300px }
.menu { position: absolute; top: 28px; left: 0; width: 320px; margin: 0; padding: 0; list-style: none;
        background: white; border: 1px solid #999 }
.menu:empty { display: none }
.menu li { padding: 2px 6px; display: flex; gap: 6px }
.menu li:first-child { font-weight: bold }
.menu li + li { border-top: 1px solid #ddd }
.menu .thumb { width: 24px; height: 24px; background: #ccd }
article { max-width: 700px; margin: 0 auto; padding: 0 16px }
article ol li::marker { color: #666 }
table { border-collapse: collapse }
td { border: 1px solid #ccc; padding: 2px 4px }
</style></head>
<body>
<header><div class="search"><input name="q" autocomplete="off" placeholder="Search"><ul class="menu" role="listbox"></ul></div></header>
<article id="a"></article>
<script>
var words = "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua".split(" ");
var a = document.getElementById("a"), html = "";
for (var i = 0; i < 400; i++) {
  var t = "";
  for (var k = 0; k < 60; k++) t += words[(i * 7 + k * 3) % words.length] + " ";
  if (i % 40 == 0) html += "<h2>Section " + (i / 40 + 1) + "</h2>";
  if (i % 25 == 5) html += "<ol><li>" + t.slice(0, 80) + "</li><li>" + t.slice(80, 160) + "</li></ol>";
  if (i % 50 == 9) html += "<table><tr><td>" + i + "</td><td>" + t.slice(0, 40) + "</td></tr><tr><td>x</td><td>y</td></tr></table>";
  html += "<p>" + t + "<a href='#'>link " + i + "</a>.</p>";
}
a.innerHTML = html;
var input = document.querySelector("input"), menu = document.querySelector(".menu");
input.addEventListener("input", function () {
  var v = input.value;
  while (menu.firstChild) menu.removeChild(menu.firstChild);
  for (var i = 0; i < 8 && v; i++) {
    var li = document.createElement("li");
    li.setAttribute("role", "option");
    var th = document.createElement("span");
    th.className = "thumb";
    var s = document.createElement("span");
    s.textContent = v + " " + words[(v.length * 5 + i) % words.length];
    li.appendChild(th);
    li.appendChild(s);
    menu.appendChild(li);
  }
  input.setAttribute("aria-expanded", v ? "true" : "false");
});
</script>
</body></html>
