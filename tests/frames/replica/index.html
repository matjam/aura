<!DOCTYPE html>
<!-- A local stand-in for a page that shows an image-tile challenge in a
     frame (docs/frames.md, "To try an image-tile challenge without a real
     one"). The container is made hidden and off screen, then moved into
     view by script, as reCAPTCHA places its challenge frame. -->
<html><head><title>Image tiles</title></head>
<body style="margin:0;background:#eee">
<p>Host page</p>
<script>
var outer = document.createElement('div');
outer.style.cssText = 'visibility: hidden; position: absolute; width: 100%; top: -10000px; left: 0px; right: 0px; transition: visibility 0s linear 0.3s, opacity 0.3s linear; opacity: 0;';
var shade = document.createElement('div');
shade.style.cssText = 'width: 100%; height: 100%; position: fixed; top: 0px; left: 0px; z-index: 2000000000; background-color: rgb(255, 255, 255); opacity: 0.05;';
var box = document.createElement('div');
box.style.cssText = 'border: 1px solid rgb(204, 204, 204); box-shadow: rgba(0, 0, 0, 0.2) 2px 2px 3px; position: absolute; z-index: 2000000000; background-color: rgb(255, 255, 255);';
var ifr = document.createElement('iframe');
ifr.setAttribute('frameborder', '0');
ifr.setAttribute('scrolling', 'no');
ifr.src = 'bframe.html';
ifr.style.cssText = 'width: 400px; height: 580px;';
box.appendChild(ifr);
outer.appendChild(shade);
outer.appendChild(box);
document.body.appendChild(outer);
setTimeout(function () {
  outer.style.transition = 'visibility 0s linear 0s, opacity 0.3s linear';
  outer.style.visibility = 'visible';
  outer.style.opacity = '1';
  outer.style.top = '10px';
  box.style.left = '20px';
  box.style.top = '0px';
}, 50);
</script>
</body></html>
