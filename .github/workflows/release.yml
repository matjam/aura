# Releases, with release-please.
#
# On every push to main, release-please reads the Conventional Commits
# since the last release and opens or updates one pull request, "chore:
# release VERSION", which sets AU_VERSION in src/browser/credits.h,
# version.txt, CHANGELOG.md and .release-please-manifest.json. Merging
# that pull request is the release: on that push release-please tags the
# commit vVERSION and creates the GitHub release, and the jobs below build
# the Mac OS 9 archive and the Linux packages from the same commit and
# attach Aura-VERSION.hqx, Aura-VERSION.sea.bin, aura_VERSION_amd64.deb and
# Aura-VERSION-x86_64.AppImage to it.
#
# The build runs here, not in a workflow started by the tag: a tag made
# with GITHUB_TOKEN starts no workflow. release-please needs the
# repository setting "Allow GitHub Actions to create and approve pull
# requests". Actions are pinned to a commit; the comment names the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal token, when the repository has one, so that the
          # release pull request and the tag are made as its owner and
          # start CI like any other push (events made with GITHUB_TOKEN
          # start no workflow). Without the secret GITHUB_TOKEN is used.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Mac OS 9
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-ppc.yml

  build-linux:
    name: Linux (GTK4)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-linux.yml

  upload:
    name: Attach the packages
    needs: [release-please, build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Check the tag against the version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
          LINUX_VERSION: ${{ needs.build-linux.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ] || [ "$TAG" != "v$LINUX_VERSION" ]; then
            echo "The tag is $TAG, but the builds are versions $VERSION and $LINUX_VERSION." >&2
            exit 1
          fi
          ls -l artifacts
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release upload "$TAG"
          "artifacts/Aura-$VERSION.hqx" "artifacts/Aura-$VERSION.sea.bin"
          "artifacts/aura_${VERSION}_amd64.deb" "artifacts/Aura-$VERSION-x86_64.AppImage"
          --repo "$GITHUB_REPOSITORY" --clobber
