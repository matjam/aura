name: probe
on:
  push:
    branches: [ci]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: clang-plain, cc: clang, flags: ""}
          - {name: clang-asan, cc: clang, flags: "-fsanitize=address"}
          - {name: clang-ubsan, cc: clang, flags: "-fsanitize=undefined"}
          - {name: gcc-asan, cc: gcc, flags: "-fsanitize=address,undefined"}
          - {name: clang-O0-asan, cc: clang, flags: "-fsanitize=address -O0"}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - run: cmake -S . -B b -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_FLAGS="${{ matrix.flags }}"
      - run: cmake --build b --target test_relayout
      - run: |
          ASAN_OPTIONS=detect_leaks=0 b/tests/layout/test_relayout tests/page/samples || true
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0 b/tests/layout/test_relayout tests/page/samples || true
          ASAN_OPTIONS=detect_leaks=0:malloc_fill_byte=0:max_malloc_fill_size=100000000 b/tests/layout/test_relayout tests/page/samples || true
