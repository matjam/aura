# Build the Mac OS 9 application and the self-extracting archive, and
# upload the archive's two forms as artifacts. Called by ci.yml (every
# push and pull request) and by release.yml (when a release is made).
#
#   toolchain  build Retro68 with toolchain/build.sh when the cache has no
#              copy for this version of the script
#   ppc        ./build.sh ppc, then upload Aura-VERSION.hqx and
#              Aura-VERSION.sea.bin
#
# Actions are pinned to a commit; the comment names the release.
name: Mac OS 9 build

on:
  workflow_call:
    outputs:
      version:
        description: Aura's version (AU_VERSION)
        value: ${{ jobs.ppc.outputs.version }}
      hqx-artifact:
        description: The artifact holding Aura-VERSION.hqx
        value: ${{ jobs.ppc.outputs.hqx }}
      sea-artifact:
        description: The artifact holding Aura-VERSION.sea.bin
        value: ${{ jobs.ppc.outputs.sea }}

permissions:
  contents: read

env:
  RETRO68_DEPS: >-
    cmake ninja-build g++ libgmp-dev libmpfr-dev libmpc-dev
    libboost-all-dev bison flex texinfo ruby

jobs:
  # A cold build takes about 15 minutes, so a newer push does not cancel
  # it: the group lets one build finish while the newest waits.
  toolchain:
    name: Retro68 toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: toolchain-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look for the toolchain in the cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/retro68
          key: retro68-${{ runner.os }}-${{ hashFiles('toolchain/build.sh') }}
          lookup-only: true
      - name: Install what Retro68 needs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q $RETRO68_DEPS
      - name: Build Retro68
        if: steps.cache.outputs.cache-hit != 'true'
        run: toolchain/build.sh
      - name: Save the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/retro68
          key: retro68-${{ runner.os }}-${{ hashFiles('toolchain/build.sh') }}

  ppc:
    name: Mac OS 9 build and archive
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ppc-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.names.outputs.version }}
      hqx: ${{ steps.names.outputs.hqx }}
      sea: ${{ steps.names.outputs.sea }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/retro68
          key: retro68-${{ runner.os }}-${{ hashFiles('toolchain/build.sh') }}
          fail-on-cache-miss: true
      - name: Install what the toolchain runs with
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q $RETRO68_DEPS
      - name: Build
        run: ./build.sh ppc
      - name: Name the artifacts
        id: names
        run: |
          version=$(tools/version.sh)
          short=$(git rev-parse --short=7 HEAD)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "hqx=Aura-$version-$short-hqx" >>"$GITHUB_OUTPUT"
          echo "sea=Aura-$version-$short-sea-bin" >>"$GITHUB_OUTPUT"
      - name: Upload the BinHex archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.hqx }}
          path: build/ppc/dist/Aura-${{ steps.names.outputs.version }}.hqx
          if-no-files-found: error
      - name: Upload the MacBinary archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.sea }}
          path: build/ppc/dist/Aura-${{ steps.names.outputs.version }}.sea.bin
          if-no-files-found: error
