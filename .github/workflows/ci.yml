# Build and test Aura on every push to main and every pull request.
#
#   host      configure, build and run the tests (Ubuntu with GCC, macOS
#             with Apple Clang)
#   sanitize  the tests under AddressSanitizer and UBSan (Ubuntu, Clang)
#   linux     the GTK4 port, a .deb and an AppImage (build-linux.yml),
#             uploaded as artifacts
#   ppc       the Mac OS 9 application and the self-extracting archive
#             (build-ppc.yml), uploaded as artifacts
#   gtk       the Linux GTK4 application (-DAURA_PLATFORM=gtk) builds
#
# Releases are made by release.yml. Nothing here needs the guest disk
# images, QEMU or a secret. Actions are pinned to a commit; the comment
# names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: host-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q ninja-build
          else
            brew install ninja
          fi
      - name: Build and test
        run: ./build.sh test

  sanitize:
    name: Tests under ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sanitize-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=undefined,float-cast-overflow"
      - name: Build
        run: cmake --build build/asan
      - name: Fetch Domato
        # The DOM fuzzer's page generator, at the commit pinned in the
        # script; the js_domato test runs 30 of its pages and skips
        # without it.
        run: tests/domato/fetch-domato.sh
      - name: Test
        env:
          # Leak detection is off, as it is on macOS, where the sanitizer
          # build is run by hand: several tests do not free everything at
          # exit.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build/asan --output-on-failure

  gtk:
    name: Linux GTK4 build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gtk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK4, Fontconfig and Ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-4-dev libfontconfig-dev ninja-build
      - name: Configure
        run: cmake -S . -B build/gtk -G Ninja -DAURA_PLATFORM=gtk
      - name: Build
        run: cmake --build build/gtk

  ppc:
    name: Mac OS 9
    uses: ./.github/workflows/build-ppc.yml

  linux:
    name: Linux (GTK4)
    uses: ./.github/workflows/build-linux.yml
