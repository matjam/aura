# Build and test Aura.
#
#   host       configure, build and run the tests (Ubuntu with GCC, macOS
#              with Apple Clang)
#   sanitize   the tests under AddressSanitizer and UBSan (Ubuntu, Clang)
#   toolchain  build Retro68 with toolchain/build.sh when the cache has no
#              copy for this version of the script
#   ppc        build the Mac OS 9 application and the self-extracting
#              archive (BinHex and MacBinary), and upload them
#   release    on a tag v*, attach the two archives to a GitHub release
#
# Nothing here needs the guest disk images, QEMU or a secret.
name: CI

on:
  push:
    branches: [main, ci]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RETRO68_DEPS: >-
    cmake ninja-build g++ libgmp-dev libmpfr-dev libmpc-dev
    libboost-all-dev bison flex texinfo ruby

jobs:
  host:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: host-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q ninja-build
          else
            brew install ninja
          fi
      - name: Build and test
        run: ./build.sh test

  sanitize:
    name: Tests under ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sanitize-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build/asan
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build/asan --output-on-failure

  # A cold build takes about an hour, so a newer push does not cancel it:
  # the group lets one build finish while the newest waits.
  toolchain:
    name: Retro68 toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: toolchain-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Look for the toolchain in the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/opt/retro68
          key: retro68-${{ runner.os }}-${{ hashFiles('toolchain/build.sh') }}
          lookup-only: true
      - name: Install what Retro68 needs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q $RETRO68_DEPS
      - name: Build Retro68
        if: steps.cache.outputs.cache-hit != 'true'
        run: toolchain/build.sh
      - name: Save the toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/opt/retro68
          key: retro68-${{ runner.os }}-${{ hashFiles('toolchain/build.sh') }}

  ppc:
    name: Mac OS 9 build and archive
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ppc-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Restore the toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/opt/retro68
          key: retro68-${{ runner.os }}-${{ hashFiles('toolchain/build.sh') }}
          fail-on-cache-miss: true
      - name: Install what the toolchain runs with
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q $RETRO68_DEPS
      - name: Build
        run: ./build.sh ppc
      - name: Name the artifacts
        id: names
        run: |
          echo "version=$(tools/version.sh)" >>"$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >>"$GITHUB_OUTPUT"
      - name: Upload the BinHex archive
        uses: actions/upload-artifact@v4
        with:
          name: Aura-${{ steps.names.outputs.version }}-${{ steps.names.outputs.short }}-hqx
          path: build/ppc/dist/Aura-${{ steps.names.outputs.version }}.hqx
          if-no-files-found: error
      - name: Upload the MacBinary archive
        uses: actions/upload-artifact@v4
        with:
          name: Aura-${{ steps.names.outputs.version }}-${{ steps.names.outputs.short }}-sea-bin
          path: build/ppc/dist/Aura-${{ steps.names.outputs.version }}.sea.bin
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, sanitize, ppc]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the version
        run: |
          version=$(tools/version.sh)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, but src/browser/credits.h says $version." >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "artifacts/Aura-$version.hqx" "artifacts/Aura-$version.sea.bin"
          --repo "$GITHUB_REPOSITORY" --title "Aura $version" --generate-notes
